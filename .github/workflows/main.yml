      - name: Gerar APK
        run: |
          unzip -q IUE-Android-main.zip -d projeto
          GRADLEW=$(find projeto -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Arquivo gradlew não encontrado"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/"
